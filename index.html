    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0284c7 100%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 28px;
            padding: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .header {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }
        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .city-select {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 16px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .city-select option {
            background: #0f172a;
            color: #fff;
        }
        .city p {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 4px;
        }
        .main-weather {
            text-align: center;
            margin: 15px 0 30px;
        }
        .weather-icon {
            font-size: 64px;
            margin-bottom: 8px;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.25));
        }
        .temp {
            font-size: 68px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -2px;
            background: linear-gradient(to bottom, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .condition {
            font-size: 18px;
            font-weight: 500;
            color: #e2e8f0;
            margin-top: 8px;
        }
        .details-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }
        .detail-card {
            background: rgba(15, 23, 42, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .detail-label {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .detail-value {
            font-size: 18px;
            font-weight: 600;
            color: #f8fafc;
        }
        .forecast-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #94a3b8;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .forecast-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .forecast-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
        }
        .f-day {
            font-weight: 500;
            width: 90px;
        }
        .f-icon {
            font-size: 20px;
        }
        .f-temps {
            font-weight: 600;
        }
        .f-min {
            color: #94a3b8;
            margin-left: 6px;
            font-weight: 400;
        }
        .loading {
            text-align: center;
            padding: 40px 0;
            color: #cbd5e1;
        }
    </style>
</head>
