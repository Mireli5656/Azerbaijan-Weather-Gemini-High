<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azərbaycan İnteraktiv Rayon və Kənd Xəritəsi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sol tərəf: İnteraktiv Xəritə Sahəsi -->
        <div class="map-section">
            <h1>Azərbaycan Rayon Xəritəsi</h1>
            <p class="hint">Rayonların üzərinə gəlin və ya toxunun</p>
            
            <div class="map-wrapper" id="mapWrapper">
                <!-- SVG Xəritə Nümunəsi (İmişli, Bakı, Gəncə və s. əsas rayonlar üçün vektor qrafika) -->
                <svg viewBox="0 0 800 600" class="az-map" id="azMap">
                    <!-- İmişli Rayonu -->
                    <path class="region" data-id="imishli" data-name="İmişli rayonu" 
                          d="M350,380 Q370,370 390,390 Q400,410 380,430 Q360,420 350,380 Z" 
                          fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
                    
                    <!-- Bakı Şəhəri -->
                    <path class="region" data-id="baku" data-name="Bakı şəhəri" 
                          d="M580,320 Q600,310 610,330 Q600,350 580,340 Z" 
                          fill="#0ea5e9" stroke="#ffffff" stroke-width="2"/>

                    <!-- Gəncə Şəhəri -->
                    <path class="region" data-id="ganja" data-name="Gəncə şəhəri" 
                          d="M220,280 Q240,270 250,290 Q240,310 220,300 Z" 
                          fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
                          
                    <!-- Qəbələ Rayonu -->
                    <path class="region" data-id="gabala" data-name="Qəbələ rayonu" 
                          d="M380,220 Q400,210 415,230 Q405,250 385,240 Z" 
                          fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
                </svg>
            </div>
        </div>

        <!-- Sağ tərəf: Seçilmiş Rayon və Kəndlərin Detallı Paneli -->
        <div class="details-section">
            <div class="card">
                <h2 id="regionTitle">Rayon seçin</h2>
                <p id="regionDesc" class="desc">Xəritədən bir rayona yaxınlaşın və ya seçin.</p>
                
                <div class="villages-container">
                    <h3>Qəsəbə və Kəndlər:</h3>
                    <ul id="villagesList" class="villages-list">
                        <li>Zəhmət olmasa xəritədən rayon seçin.</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
